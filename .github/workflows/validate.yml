name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the exact shared dependency pin requested for the 2026.10.4 baseline.
      # Its alignment with built-in Waze is checked by test_packaging.py.
      - name: Validate integration metadata
        run: >-
          docker run --rm -v "${{ github.workspace }}:/github/workspace"
          ghcr.io/home-assistant/hassfest --skip-plugins requirements

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          # This is a custom repository, not a new HACS default-list submission.
          # Existing repository-listing metadata is outside this package update.
          ignore: brands description license topics
